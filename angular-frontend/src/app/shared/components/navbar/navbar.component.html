<nav class="navbar glass" [class.scrolled]="isScrolled" *ngIf="showNavbar" id="main-navbar">
  <div class="navbar-container">
    <!-- Left Side: Logo & Main Navigation Links -->
    <div style="display: flex; align-items: center; gap: var(--space-8);">
      <!-- Logo -->
      <div class="navbar-logo" (click)="handleLogoClick()" id="navbar-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        </div>
        <span class="logo-text">JobPortal</span>
      </div>

      <!-- Navigation Links -->
      <div class="navbar-links">
        <a class="nav-link" (click)="navigateTo('/jobs')">Find Jobs</a>
        <a class="nav-link" (click)="navigateTo('/resume-builder')">Build Resume</a>
        <a class="nav-link" (click)="navigateTo('/dashboard')">Dashboard</a>
      </div>
    </div>

    <!-- Right Side Actions -->
    <div class="navbar-right">
      <!-- Shield Icon Link for admin login page -->
      <button
        class="btn-shield-admin"
        (click)="goToAdminLogin()"
        title="Authorized Personnel Only"
        id="admin-portal-link"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </button>

      <ng-container *ngIf="isAuthenticated && user; else unauthBlock">
        <div class="user-menu">
          <button
            class="user-menu-trigger"
            (click)="toggleDropdown()"
            id="user-menu-trigger"
          >
            <div class="user-avatar">
              {{ user.name?.charAt(0).toUpperCase() }}
            </div>
            <span class="user-name">{{ user.name }}</span>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="chevron"
              [class.rotated]="showDropdown"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div class="dropdown-menu glass-strong animate-scale-in" *ngIf="showDropdown" id="user-dropdown">
            <div class="dropdown-header">
              <p class="dropdown-user-name">{{ user.name }}</p>
              <p class="dropdown-user-email">{{ user.email }}</p>
              <span class="dropdown-role-badge">{{ user.role }}</span>
            </div>
            <div class="dropdown-divider"></div>
            <button
              class="dropdown-item"
              (click)="handleDashboard()"
              id="dropdown-dashboard"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              Dashboard
            </button>
            <button
              class="dropdown-item dropdown-item-danger"
              (click)="handleLogout()"
              id="dropdown-logout"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              Logout
            </button>
          </div>
        </div>
      </ng-container>

      <ng-template #unauthBlock>
        <button
          class="btn-get-started"
          (click)="navigateTo('/login')"
          id="btn-get-started"
        >
          Login
        </button>
      </ng-template>
    </div>
  </div>

  <!-- Click outside to close dropdown -->
  <div
    class="dropdown-overlay"
    *ngIf="showDropdown"
    (click)="closeDropdown()"
  ></div>
</nav>
