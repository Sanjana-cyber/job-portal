<!-- ══════════════════════════════════════
     Dashboard Jobs Page
     Same header as Dashboard, but body = Jobs list
     ══════════════════════════════════════ -->
<div class="dashboard-page-wrapper">

  <!-- ── Sticky Header ── -->
  <header class="dashboard-header">
    <a class="dashboard-logo" (click)="router.navigate(['/'])">
      <div class="dashboard-logo-icon"></div>
      <span class="dashboard-logo-text">TalentBridge</span>
    </a>
    <div class="dashboard-header-actions">
      <!-- Dashboard -->
      <button class="btn-nav-dashboard" (click)="router.navigate(['/dashboard'])">
        Dashboard
      </button>
      <!-- Find Jobs (active state) -->
      <button class="btn-find-jobs" disabled style="opacity:0.7;cursor:default">
        Find Jobs
      </button>
      <!-- Logout -->
      <button class="btn-logout-sm" (click)="logout()">Logout</button>
    </div>
  </header>

  <!-- ── Jobs Page embedded ── -->
  <app-jobs></app-jobs>

</div>
