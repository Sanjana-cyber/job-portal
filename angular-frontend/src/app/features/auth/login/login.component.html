<div class="auth-page">
  <div class="auth-card animate-scale-in">

    <!-- Header -->
    <div class="auth-header">
      <h2 class="auth-title">
        {{ showForgotPassword ? 'Reset Password' : 'Welcome back' }}
      </h2>
      <p class="auth-subtitle">
        {{ showForgotPassword ? "We'll help you get back in" : 'Sign in to your TalentBridge account' }}
      </p>
    </div>

    <!-- ═══ Forgot Password View ═══ -->
    <ng-container *ngIf="showForgotPassword; else loginView">
      <div class="auth-form-container">

        <div class="error-banner" *ngIf="forgotError">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>{{ forgotError }}</span>
        </div>

        <div class="success-banner" *ngIf="forgotMessage">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span>{{ forgotMessage }}</span>
        </div>

        <div class="input-group">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input
            type="email"
            class="auth-input"
            placeholder="Enter your email address"
            [(ngModel)]="forgotEmail"
            id="forgot-email"
          />
        </div>

        <button
          class="btn-primary btn-full"
          (click)="submitForgotPassword()"
          [disabled]="forgotLoading"
          id="forgot-submit-btn"
        >
          <ng-container *ngIf="forgotLoading">
            <span class="spinner"></span> Sending…
          </ng-container>
          <ng-container *ngIf="!forgotLoading">Send Reset Link</ng-container>
        </button>

        <button class="btn-ghost btn-full" (click)="hideForgot()" id="back-to-login-btn">
          ← Back to login
        </button>
      </div>
    </ng-container>

    <!-- ═══ Login View ═══ -->
    <ng-template #loginView>

      <!-- Error Banner -->
      <div class="error-banner" *ngIf="errorMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" id="login-form">

        <!-- Email -->
        <div class="input-group">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input
            formControlName="email"
            type="email"
            class="auth-input"
            placeholder="Email address"
            id="login-email"
          />
        </div>

        <!-- Password -->
        <div class="input-group">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input
            formControlName="password"
            [type]="showPassword ? 'text' : 'password'"
            class="auth-input"
            placeholder="Password"
            id="login-password"
          />
          <button type="button" class="password-toggle" (click)="togglePassword()" id="login-toggle-password">
            <!-- Eye / EyeOff icon -->
            <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>

        <!-- Forgot Password Link -->
        <button type="button" class="forgot-link" (click)="showForgot()" id="forgot-password-link">
          Forgot password?
        </button>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn-primary btn-full"
          [disabled]="loginForm.invalid || isLoading"
          id="login-submit-btn"
        >
          <ng-container *ngIf="isLoading">
            <span class="spinner"></span> Signing in…
          </ng-container>
          <ng-container *ngIf="!isLoading">Sign In</ng-container>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>or continue with</span>
      </div>

      <!-- Google Sign-In Button -->
      <div id="google-signin-btn" class="google-btn-container"></div>

      <!-- Register Link -->
      <div class="auth-footer">
        Don't have an account?
        <a routerLink="/register" class="auth-link">Register here</a>
      </div>
    </ng-template>
  </div>
</div>
